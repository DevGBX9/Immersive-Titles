# Authoritative build entry point of this project.
#
# The build matrix currently only contains:
#   1.20.1 = core project (see versions/mainProject), template compatible build
#   26.3   = active development target for the Wanderer's Titles feature
#
# Every other configured Minecraft version is disabled for now, see the "disabled_versions" list
# in settings.json and the commented block in build.gradle.
# The enabled version list is printed into the run summary by the build job.
name: Dev Builds

on:
  push:
    paths:
      - "*.gradle"
      - "gradle.properties"
      - "src/**"
      - "versions/**"
      - ".github/**"
  pull_request:


jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
#    # [FEATURE] MIXIN_AUDITOR
#    with:
#      mixin_audit: true
