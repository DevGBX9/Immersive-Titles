name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''
#      # [FEATURE] MIXIN_AUDITOR
#      mixin_audit:
#        description: run mixin audit for Minecraft after build
#        type: boolean
#        required: false
#        default: false

jobs:
  # The versions the matrix carries, read out of settings.json so that a version is enabled in
  # exactly one place: what this job publishes is one artifact per version below.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the enabled versions
        id: versions
        run: |
          versions=$(python3 -c "import json; print(json.dumps(json.load(open('settings.json'))['versions']))")
          echo "versions=$versions" | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: Show Minecraft version matrix
        run: python3 .github/workflows/scripts/version_matrix.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build with gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -z "${{ inputs.target_subproject }}" ]; then
              echo "Building all subprojects"
              ./gradlew build 2>&1 | tee build.log
          else
              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
              echo "Building with arguments=$args"
              ./gradlew $args 2>&1 | tee build.log
          fi
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      # The log of a failed run can only be downloaded by somebody with admin rights on the
      # repository, so the lines that say why it failed are published as annotations of the run,
      # which anyone who can read the repository can read.
      - name: Report the gradle failure
        if: failure()
        run: |
          if [ -f build.log ]; then
              grep -aE "error:|FAILURE:|What went wrong|Execution failed|Could not resolve|Caused by" build.log \
                  | tail -n 10 | tr -d '\r' \
                  | while IFS= read -r line; do echo "::error title=gradle build::$line"; done
          fi
          exit 0

#      # [FEATURE] MIXIN_AUDITOR
#      - name: Run mixin audit check for Minecraft client
#        if: ${{ inputs.mixin_audit }}
#        timeout-minutes: 10
#        run: |
#          mkdir -p ./run
#          echo eula=true > ./run/eula.txt  # server needs this
#          ./gradlew runClientMixinAudit

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      - name: Collect mod jars
        run: |
          shopt -s extglob
          mkdir -p mod-jars
          # one folder per Minecraft version: the jar is named after the mod version alone, so two
          # projects of the matrix build two jars of the same name and a flat folder keeps one of them
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              version=$(basename "$(dirname "$(dirname "$(dirname "$jar")")")")
              mkdir -p "mod-jars/$version"
              cp -p "$jar" "mod-jars/$version/"
          done
          ls -lR mod-jars

      - name: Report build matrix and built jars
        run: |
          enabled_versions=$(python3 -c "import json; print(', '.join(json.load(open('settings.json'))['versions']))")
          echo "::notice title=Enabled Minecraft versions::${enabled_versions}"
          for jar in mod-jars/*/*.jar; do
              echo "::notice title=Built mod jar::$(basename "$(dirname "$jar")") $(basename "$jar") ($(stat -c%s "$jar") bytes)"
          done

      # This is the artifact recommended for users to download
      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: mod-jars/**/*.jar

#      # [FEATURE] FALLENS_MAVEN
#      - name: Publish with gradle
#        if: ${{ inputs.release || github.ref == 'refs/heads/dev' }}
#        run: |
#          if [ -z "$FALLENS_MAVEN_TOKEN" ]; then
#              echo "No token found, skipping publish"
#              exit 0
#          fi
#          if [ -z "${{ inputs.target_subproject }}" ]; then
#              echo "Publishing all subprojects"
#              ./gradlew publish
#          else
#              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:publish/' | paste -sd ' ')
#              echo "Publishing with arguments=$args"
#              ./gradlew $args
#          fi
#        env:
#          BUILD_ID: ${{ github.run_number }}
#          BUILD_RELEASE: ${{ inputs.release }}
#          FALLENS_MAVEN_TOKEN: ${{ secrets.FALLENS_MAVEN_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: List artifacts
        uses: actions/github-script@v9
        id: artifacts
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            return result.data

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Make build summary
        run: |
          pip install jproperties
          python .github/workflows/scripts/summary.py
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
          WORKFLOW_ARTIFACTS: ${{ steps.artifacts.outputs.result }}

  # One artifact per Minecraft version, so every version of the mod is a download of its own rather
  # than a file inside the zip of a folder: the jar of each is named after the mod version alone (see
  # common.gradle), which is what makes two versions two files of the same name, one folder apart.
  jars:
    runs-on: ubuntu-latest
    needs:
      - build
      - matrix
    strategy:
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
      fail-fast: false

    steps:
      - name: Download the built jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: mod-jars

      - name: Upload the jar of ${{ matrix.version }}
        uses: actions/upload-artifact@v7
        with:
          name: immersive_titles-${{ matrix.version }}
          path: mod-jars/${{ matrix.version }}/*.jar
          if-no-files-found: error
