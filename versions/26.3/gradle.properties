# Fabric Properties
	# check these on https://fallen-breath.github.io/fabric-versions/?version=26.3
	minecraft_version=26.3
	parchment_version=

# Version Matrix
	# 26.3 is the core project (see versions/mainProject) and the active development target for the
	# Immersive Titles features: the shared sources in src/ are written for this version.
	# A versions/<version>/src folder is only compiled for child versions, never for the core
	# project, so all 26.3 code belongs in the shared src/ folder.

# Fabric Mod Metadata
	minecraft_dependency=>=26.3 <26.4

# Build Information
	# The target mc versions for the mod during mod publishing, separated with newline
	game_versions=26.3

# Dependencies
	# Fabric API is required by the Immersive Titles client feature (title reveal overlay, key
	# mapping, client level events) and is declared as a dependency in fabric.mod.json, which is
	# built from this value: see the `mcVersion >= 260300` block in common.gradle and the
	# fabric_api_dependency entry of processResources there.
	fabric_api_version=0.160.5+26.3
