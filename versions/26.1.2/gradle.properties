# Fabric Properties
	# check these on https://fallen-breath.github.io/fabric-versions/?version=26.1.2
	minecraft_version=26.1.2
	parchment_version=

# Version Matrix
	# 26.1.2 is the child of 26.2 (see build.gradle), which is itself built by the preprocessor out of
	# the shared sources in src/: the three enabled 26.x versions are one feature with one
	# implementation, and no line of the mod is kept out of 26.1.2. A versions/<version>/src folder is
	# only compiled for a child version that has to differ, and there is none here.
	# 26.x is not obfuscated, so its node is created with `null` mappings (see build.gradle).

# Fabric Mod Metadata
	minecraft_dependency=>=26.1 <26.2

# Build Information
	# The target mc versions for the mod during mod publishing, separated with \n
	game_versions=26.1\n26.1.1\n26.1.2

# Dependencies
	# Fabric API is required by the Immersive Titles client features (title reveal overlay, key
	# mapping, client level events) and is declared as a dependency in fabric.mod.json, which is
	# built from this value: see the `mcVersion >= 260102` block in common.gradle and the
	# fabric_api_dependency entry of processResources there. 0.155.3 is the last Fabric API built for
	# 26.1.2, and the Minecraft part of the version is left out of the declared range, so the mod asks
	# for ">=0.155.3" whatever game it is installed in.
	fabric_api_version=0.155.3+26.1.2

# Mod Menu is what opens the collection screen from the mod list (see ModMenuIntegration). It is a
# compile only dependency: the mod does not require it, and the modmenu entrypoint of
# fabric.mod.json is only read when it is installed. It is built once per Minecraft version, and
# 18.0.2 is the build for 26.1, 26.1.1 and 26.1.2 - 20.0.0 and newer belong to 26.2 and refuse an
# older game. See https://modrinth.com/mod/modmenu/versions?g=26.1.2 or
# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/
	modmenu_version=18.0.2
