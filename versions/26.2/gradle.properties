# Fabric Properties
	# check these on https://fallen-breath.github.io/fabric-versions/?version=26.2
	minecraft_version=26.2
	parchment_version=

# Version Matrix
	# 26.2 is a child of the core project (26.3, see versions/mainProject): the preprocessor builds it
	# out of the shared sources in src/, so the two versions are one feature with one implementation.
	# A versions/<version>/src folder is only compiled for a child version that has to differ, and
	# there is none here: 26.2 is built out of the same src/ as 26.3, unguarded.
	# 26.x is not obfuscated, so its node is created with `null` mappings (see build.gradle).

# Fabric Mod Metadata
	minecraft_dependency=>=26.2 <26.3

# Build Information
	# The target mc versions for the mod during mod publishing, separated with \n
	game_versions=26.2

# Dependencies
	# Fabric API is required by the Immersive Titles client features (title reveal overlay, key
	# mapping, client level events) and is declared as a dependency in fabric.mod.json, which is
	# built from this value: see the `mcVersion >= 260200` block in common.gradle and the
	# fabric_api_dependency entry of processResources there. The Minecraft part of the version is
	# left out of the declared range, so the mod asks for ">=0.160.0" whatever game it is installed in.
	fabric_api_version=0.160.0+26.2

# Mod Menu is what opens the collection screen from the mod list (see ModMenuIntegration). It is a
# compile only dependency: the mod does not require it, and the modmenu entrypoint of
# fabric.mod.json is only read when it is installed. The API this mod uses (ModMenuApi,
# ConfigScreenFactory) is the same in the two 26.x builds the matrix carries, so this project is
# compiled against the version 26.3 is built with - see
# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/ for the builds per game version.
	modmenu_version=21.0.0
