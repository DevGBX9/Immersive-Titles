# Fabric Properties
	# check these on https://fallen-breath.github.io/fabric-versions/?version=1.21.2
	minecraft_version=1.21.2
	parchment_version=

# Version Matrix
	# 1.21.2 is a child of the version above it in the chain (see build.gradle), built by the
	# preprocessor out of the shared sources in src/, so it is the same feature as the rest of the
	# matrix. It is an obfuscated version, so its node is created with the empty mappings value and
	# Loom remaps it; the game's drawing, input and id classes are named as they were before 26.x, so
	# the code that touches them is guarded with `//#if MC >= 26.0` in the shared sources.

# Fabric Mod Metadata
	minecraft_dependency=>=1.21.2 <1.21.3

# Build Information
	# The target mc versions for the mod during mod publishing, separated with 

	game_versions=1.21.2

# Dependencies
	# Fabric API is required by the Immersive Titles client features and is declared as a dependency
	# in fabric.mod.json, which is built from this value: see the `mcVersion >= 12109` block in
	# common.gradle and the fabric_api_dependency entry of processResources there. 0.128.2+1.21.2 is the last
	# Fabric API built for 1.21.2, and the Minecraft part of the version is left out of the declared
	# range, so the mod asks for ">=0.128.2" whatever game it is installed in.
	fabric_api_version=0.106.1+1.21.2

# Mod Menu is what opens the collection screen from the mod list (see ModMenuIntegration). It is a
# compile only dependency: the mod does not require it, and the modmenu entrypoint of
# fabric.mod.json is only read when it is installed. 15.0.2 is the build for 1.21.2 - see
# https://modrinth.com/mod/modmenu/versions?g=1.21.2 or
# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/
	modmenu_version=12.0.1
